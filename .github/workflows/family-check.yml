name: Family contract
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  family-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run family:check
        run: npm run family:check
