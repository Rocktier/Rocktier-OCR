[package]
name = "ocr-engine"
version = "0.1.0"
edition = "2021"
description = "PP-OCRv4 inference in Rust via ONNX Runtime - the product engine, no Python"

[dependencies]
serde_json = "1"
ort = { version = "2.0.0-rc.10", features = [] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
clipper2 = "0.6.0"
