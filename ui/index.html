<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./styles/tokens.css" />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="256x256" href="./favicon.png" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <title>Rocktier OCR</title>
  <script>
    // 主题必须在内联样式解析前定好：异步设置会先按默认深色画一帧再跳变。
    // 默认跟随系统（家族 MD/Journal 同规则），手动选择记本机。
    (function () {
      try {
        // 2026-10-04 键改名后与运行时对齐：主题已改读 "rocktier.theme"，
        // 这里原先还在读旧的主题键 —— 后果是老用户会看到「先按旧键画首帧、
        // React 挂载后跳成另一种」。旧键保留为回落。
        var saved = localStorage.getItem("rocktier.theme") || localStorage.getItem("rocktier-ocr-theme");
        var t = saved === "light" || saved === "dark" || saved === "auto" ? saved : null;
        if (!t || t === "auto")
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        // 隐私模式：localStorage 抛异常时按深色渲染，功能不受影响
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
/* Geist 家族品牌字体（2026-09-28 定案，audit 7B-5；SIL OFL 自托管可变字体） */
@font-face {
  font-family: "Geist";
  src: url("./fonts/Geist-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Geist Mono";
  src: url("./fonts/GeistMono-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}


    /* 家族 token（与 Rocktier PDF 的 tokens.css 同一套） */
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-elevated: #121212;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --text-primary: rgba(255, 255, 255, 0.95);
      --text-secondary: rgba(255, 255, 255, 0.72);
      --text-tertiary: rgba(255, 255, 255, 0.58);
      --accent: #ffffff;
      --on-accent: #000000;
      --red: #ff4a3d;
      /* --success 深色档不再重定义：走母版（2026-10-06 终裁去绿 = #ffffff）。
         原先这里是 .95 —— 纯 alpha 微差，不影响可读性，但会让令牌回退扫描器
         继续把本仓列为 --success 回退。 */
      /* 家族四档圆角（对齐 MD/PDF tokens.css） */
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
      --accent-hover: rgba(255, 255, 255, 0.88);
    }
    /* 浅色主题：值与 MD tokens.css 的浅色档逐项一致（家族基线） */
    [data-theme="light"] {
  --bg-secondary: #f5f5f5;
  --accent-hover: rgba(0, 0, 0, 0.88);
  --text-primary: rgba(0, 0, 0, 0.92);
  --text-secondary: rgba(0, 0, 0, 0.64);
  --text-tertiary: rgba(0, 0, 0, 0.60);
  --text-muted: rgba(0, 0, 0, 0.58);
  --danger: #b8342a;
  --warning: #c0392b;

      --bg-primary: #ffffff;
      --bg-elevated: #ffffff;
      --bg-card: rgba(0, 0, 0, 0.03);
      --bg-card-hover: rgba(0, 0, 0, 0.06);
      --border: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.16);
      --accent: #000000;
      --on-accent: #ffffff;
      --red: #e64537;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .brand-mark { width: 26px; height: 26px; flex: none; }
    .brand-mark .brand-tile { fill: #0a0a0a; stroke: var(--border); stroke-width: 1; }
    .brand-mark .brand-letters { fill: #ffffff; font-family: inherit; }
    .brand-mark .brand-badge { fill: #ffffff; }
    .brand-mark .brand-pip { fill: var(--red); }
    header h1 { font-size: 14.5px; font-weight: 600; letter-spacing: .2px; }
    header .tag {
      margin-left: auto; font-size: 11px; color: var(--text-tertiary);
      letter-spacing: .3px;
    }

    main { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }

    #drop {
      border: 1px dashed var(--border-hover);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      padding: 44px 24px;
      text-align: center;
      transition: background .15s, border-color .15s;
      cursor: pointer;
    }
    #drop:hover { background: var(--bg-card-hover); }
    #drop.over { border-color: var(--red); background: var(--bg-card-hover); }
    #drop .big { font-size: 15.5px; font-weight: 600; }
    #drop .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 7px; line-height: 1.6; }
    #drop .path {
      margin-top: 14px; font-size: 12px; color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all;
    }

    .row { display: flex; align-items: center; gap: 10px; }
    button {
      font: inherit; font-size: 13px; font-weight: 500;
      padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);
      transition: background .15s, border-color .15s;
    }
    button:hover:not(:disabled) { background: var(--bg-card-hover); border-color: var(--border-hover); }
    button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .4; cursor: default; }

    /* 键盘焦点可见性（a11y）：仅键盘触发 :focus-visible，鼠标点击不留描边 */
    :focus-visible { outline: 2px solid var(--accent, #fff); outline-offset: 2px; }
    :focus:not(:focus-visible) { outline: none; }

    button.lang {
      margin-left: 10px; padding: 4px 9px; font-size: 11px; border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    #status { margin-left: auto; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

    #bar-wrap { height: 4px; background: var(--dot); border-radius: 2px; overflow: hidden; display: none; }
    #bar { height: 100%; width: 0%; background: var(--red); transition: width .2s; }

    #done {
      display: none; font-size: 13px; line-height: 1.7;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px 16px;
    }
    #done b { color: var(--success); font-weight: 600; }
    #done .out { color: var(--text-secondary); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }

    #log {
      display: none; flex: 1; min-height: 90px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
      color: var(--text-secondary); overflow: auto; white-space: pre-wrap;
    }

    footer {
      padding: 10px 22px; font-size: 11.5px; color: var(--text-tertiary);
      border-top: 1px solid var(--border); background: var(--bg-secondary);
    }

    /* ───────── 许可胶囊 + 激活对话框（家族 L6，逻辑在 license.js） ─────────
       胶囊样式已收编为母版 tokens.css 的 .badge-license（2026-10-25 审计 D-78），
       这里不再保留本地定义。 */

    .license-overlay {
      position: fixed; inset: 0; z-index: 1100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .license-overlay[hidden] { display: none; }
    .license-dialog {
      width: min(400px, calc(100vw - 48px));
      max-height: min(520px, calc(100vh - 48px));
      overflow-y: auto;
      background: var(--bg-secondary); border: 1px solid var(--border-hover);
      border-radius: var(--radius-md); box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
    }
    .license-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
    .license-header h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .license-close {
      border: none; background: none; color: var(--text-tertiary); cursor: pointer;
      font-size: 18px; line-height: 1; padding: 2px 8px; border-radius: 8px;
    }
    .license-close:hover { color: var(--text-primary); background: var(--bg-card-hover); }
    .license-body { padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 8px; }
    .license-body p { font-size: 12px; color: var(--text-primary); line-height: 1.6; }
    .license-body small { font-size: 11px; color: var(--text-tertiary); line-height: 1.55; display: block; }
    .license-body .license-error { color: var(--red-ink); }
    .license-field { display: flex; flex-direction: column; gap: 5px; }
    .license-field label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
    .license-field input {
      border: 1px solid var(--border-hover); border-radius: var(--radius-sm);
      padding: 8px 10px; font-size: 12px; background: var(--bg-card);
      color: var(--text-primary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .license-field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .license-footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px 14px; flex-wrap: wrap; }
    /* 复用全局 button / button.primary（激活钮），只在对话框里收紧尺寸；
       margin-inline-start: auto 使激活钮在 RTL 布局下也靠右（家族惯例） */
    .license-footer button { padding: 6px 14px; font-size: 12px; border-radius: var(--radius-sm); min-height: 30px; }
    .license-footer button.primary { margin-inline-start: auto; font-weight: 600; }

/* 三态图标互斥：auto 显示「屏幕」，light 显示月牙，dark 显示太阳 */
.icon-btn .sun, .icon-btn .moon, .icon-btn .monitor { display: none; }
.icon-btn[data-mode="auto"] .monitor { display: block; }
.icon-btn[data-mode="light"] .moon { display: block; }
.icon-btn[data-mode="dark"] .sun { display: block; }

    /* 家族统一 reduced-motion 方案（0.01ms 而非 0：保留 transitionend/animationend 事件，
        ui-ux-pro-max a11y 基线；audit 7B-3 CRITICAL 项） */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }


  /* ── 检查更新对话框（入口：帮助菜单「检查更新…」）────────────────────
     点击才联网：启动时、工作中、后台都不检查，见 updates.js 头注。
     右下角常驻悬浮入口已移除 —— fixed 定位没有 right 时会停在静态位置，
     盖住底部内容（Compressor v0.1.10 实测），故全部收进菜单 + 本对话框。
     结构照 .license-overlay 系列，z-index 对齐。 */
    .update-overlay {
      position: fixed; inset: 0; z-index: 1100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .update-overlay[hidden] { display: none; }
    .update-dialog {
      width: min(400px, calc(100vw - 48px));
      max-height: min(520px, calc(100vh - 48px));
      overflow-y: auto;
      background: var(--bg-secondary); border: 1px solid var(--border-hover);
      border-radius: var(--radius-md); box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
    }
    .update-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
    .update-header h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .update-close {
      border: none; background: none; color: var(--text-tertiary); cursor: pointer;
      font-size: 18px; line-height: 1; padding: 2px 8px; border-radius: 8px;
    }
    .update-close:hover { color: var(--text-primary); background: var(--bg-card-hover); }
    .update-body { padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 8px; }
    .update-body p { font-size: 12px; color: var(--text-primary); line-height: 1.6; }
    .update-body small { font-size: 11px; color: var(--text-tertiary); line-height: 1.55; display: block; }
    .update-footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px 14px; flex-wrap: wrap; }
    .update-footer-spacer { flex: 1; }
    .update-footer button {
      min-height: 30px; padding: 6px 14px; font-size: 12px;
      border: 1px solid var(--border-hover); border-radius: var(--radius-sm);
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
    }
    .update-footer button:hover { border-color: var(--accent); }
    /* 「获取 v…」主按钮：有新版时唯一需要用户点的动作，用 accent 让它显眼。 */
    .update-footer button.update-get-btn {
      background: var(--accent); border-color: transparent; color: var(--bg); font-weight: 600;
    }
  </style>
</head>
<!-- ══════════════════════════════════════════════════════════════
     ↓↓↓ 界面本体（body）↓↓
     本段是 UI 的全部结构：拖放区、控件、许可胶囊，以及四个脚本入口
     （lang.js / license.js / app.js / updates.js）。

     ⚠️ 2026-10-21（v0.2.9, commit a28330c）事故记录：
     那次提交本意只是把「检查更新」入口收进菜单，却顺手把整个 body
     连同四个脚本入口一起删掉了 —— 结果应用能开窗、但页面全白。
     OCR 的前端不走打包（frontendDist 直接指向 ui/），所以这次误删
     是**直接生效**的：v0.2.9 与 v0.2.10 两个 macOS / Windows 包都是空壳。

     同一模板的改动在 pic2webp 也复制了一份（f5297b5, v1.9.14），
     同样把 body 删空。两处都已从事故前的版本完整恢复。

     本段已于 2026-10-25 从 v0.2.8 完整恢复。改动本段前务必确认：
       ① body 的开闭标签成对存在
       ② 四个脚本入口（lang/license/app/updates.js）仍在
     家族闸门已加 frontend-entry-integrity 规则把关这两条。
     ══════════════════════════════════════════════════════════════
-->
<body>
  <header>
    <img class="brand-mark" src="./favicon.png" alt="" />
    <h1 data-i18n="title">Rocktier OCR</h1>
    <span class="dot-live" aria-hidden="true"></span>
    <span class="tag" data-i18n="tagline">Make scans searchable</span>
    <button class="badge-license" id="license-pill" hidden></button>
    <button id="rocktier.lang" class="rocktier.lang" title="中文 / EN">EN</button>
    <!-- 家族唯一主题按钮：.icon-btn（28×28 + 40×40 命中区），三态 auto→light→dark。
         此前用 ☾ / ☀ 字符冒充图标：字形覆盖取决于系统字体，且各字形基线不一致。 -->
    <button id="rocktier.theme" class="icon-btn" data-mode="auto" title="Theme" aria-label="Theme">
      <svg class="monitor" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 17v3.5"/></svg>
      <svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>
  <main>
    <div id="drop">
      <div class="big" data-i18n="dropBig">Drop a PDF or an image here</div>
      <div class="sub">
        <span data-i18n="dropSub1">Scans and image-only PDFs are recognised and given a searchable text layer</span><br>
        <span data-i18n="dropSub2">An image is wrapped into a one-page searchable PDF; born-digital pages are skipped untouched</span>
      </div>
      <div class="path" id="path"></div>
    </div>
    <div class="row">
      <button id="go" class="primary" data-i18n="start" disabled>Convert</button>
      <button id="pdf" data-i18n="exportPdf" disabled>Export PDF</button>
      <button id="txt" data-i18n="exportTxt" disabled>Export TXT</button>
      <button id="copy" data-i18n="copyText" disabled>Copy text</button>
      <button id="cancel" data-i18n="cancel" disabled>Cancel</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="done"></div>
    <div id="log" role="log" aria-live="polite"></div>
  </main>
  <footer data-i18n="footer">Recognition happens on this machine. Your document never leaves it.</footer>
  <script src="lang.js"></script>
  <script src="license.js"></script>
  <script src="app.js"></script>
  <script src="updates.js"></script>
  <script>
    // 主题：auto → light → dark 三态循环（家族 §6.5 唯一状态机）。
    // 存储键沿用既有的 "rocktier-ocr-theme"：无值 = auto（跟随系统）。
    // 改键会让老用户的偏好丢失，所以只扩值域、不换键。
    (function () {
      var KEY = "rocktier-ocr-theme";
      var CYCLE = ["auto", "light", "dark"];
      var btn = document.getElementById("rocktier.theme");
      if (!btn) return;

      var lightMq = window.matchMedia("(prefers-color-scheme: light)");

      function systemTheme() {
        return lightMq.matches ? "light" : "dark";
      }

      /** auto 落成实际生效值 —— data-theme 只接受 light/dark。 */
      function resolveTheme(mode) {
        return mode === "auto" ? systemTheme() : mode;
      }

      function readMode() {
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) {}
        return saved === "light" || saved === "dark" || saved === "auto" ? saved : "auto";
      }

      function strings() {
        // lang.js 顶层 let current 暴露当前语言（zh / en），script 作用域内可直接引用
        var lang = "en";
        try { if (typeof current === "string") lang = current; } catch (e) {}
        return (typeof STRINGS !== "undefined" && (STRINGS[lang] || STRINGS.en)) || {};
      }

      function sync(mode) {
        btn.setAttribute("data-mode", mode);
        var s = strings();
        var label =
          mode === "light" ? (s.themeModeLight || "Light")
          : mode === "dark" ? (s.themeModeDark || "Dark")
          : (s.themeModeAuto || "Follow system");
        var text = (s.themeLabel || "Theme") + " \u00b7 " + label;
        btn.title = text;
        btn.setAttribute("aria-label", (s.themeLabel || "Theme") + ": " + label);
      }

      function apply(mode) {
        document.documentElement.setAttribute("data-theme", resolveTheme(mode));
        sync(mode);
      }

      apply(readMode());

      // auto 态下系统外观变了要跟着变；light/dark 是明确选择，不动。
      if (lightMq.addEventListener) {
        lightMq.addEventListener("change", function () {
          if (readMode() === "auto") apply("auto");
        });
      }

      btn.addEventListener("click", function () {
        var next = CYCLE[(CYCLE.indexOf(readMode()) + 1) % CYCLE.length];
        try {
          localStorage.setItem(KEY, next);
        } catch (e) {
          // 隐私模式：仅本次会话生效
        }
        apply(next);
      });

      // 语言切换后刷新标题：applyLang 是挂 window 的函数声明，包一层即可同步
      var origApplyLang = window.applyLang;
      window.applyLang = function () {
        if (typeof origApplyLang === "function") origApplyLang();
        sync(readMode());
      };
    })();
  </script>
</body>
</html>
