<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rocktier OCR</title>
  <script>
    // 主题必须在内联样式解析前定好：异步设置会先按默认深色画一帧再跳变。
    // 默认跟随系统（家族 MD/Journal 同规则），手动选择记本机。
    (function () {
      try {
        var saved = localStorage.getItem("rocktier-ocr-theme");
        var t = saved === "light" || saved === "dark" ? saved : null;
        if (!t)
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        // 隐私模式：localStorage 抛异常时按深色渲染，功能不受影响
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
    /* 家族 token（与 Rocktier PDF 的 tokens.css 同一套） */
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-elevated: #121212;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --text-primary: rgba(255, 255, 255, 0.95);
      --text-secondary: rgba(255, 255, 255, 0.66);
      --text-tertiary: rgba(255, 255, 255, 0.42);
      --accent: #ffffff;
      --accent-text: #000000;
      --red: #ff4a3d;
      --dot: rgba(255, 255, 255, 0.18);
      --success: rgba(48, 209, 88, 0.95);
      --radius: 12px;
    }
    /* 浅色主题：值与 MD tokens.css 的浅色档逐项一致（家族基线） */
    [data-theme="light"] {
      --bg-primary: #e8e8e8;
      --bg-secondary: #eeeeee;
      --bg-elevated: #ffffff;
      --bg-card: rgba(0, 0, 0, 0.03);
      --bg-card-hover: rgba(0, 0, 0, 0.06);
      --border: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.16);
      --text-primary: rgba(0, 0, 0, 0.95);
      --text-secondary: rgba(0, 0, 0, 0.66);
      --text-tertiary: rgba(0, 0, 0, 0.42);
      --accent: #000000;
      --accent-text: #ffffff;
      --red: #ff4a3d;
      --dot: rgba(0, 0, 0, 0.12);
      --success: rgba(48, 209, 88, 0.95);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .brand-mark { width: 26px; height: 26px; flex: none; }
    .brand-mark .brand-tile { fill: #0a0a0a; stroke: var(--border); stroke-width: 1; }
    .brand-mark .brand-letters { fill: #ffffff; font-family: inherit; }
    .brand-mark .brand-badge { fill: #ffffff; }
    .brand-mark .brand-pip { fill: var(--red); }
    header h1 { font-size: 14.5px; font-weight: 600; letter-spacing: .2px; }
    header .tag {
      margin-left: auto; font-size: 11px; color: var(--text-tertiary);
      letter-spacing: .3px;
    }

    main { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }

    #drop {
      border: 1px dashed var(--border-hover);
      border-radius: var(--radius);
      background: var(--bg-card);
      padding: 44px 24px;
      text-align: center;
      transition: background .15s, border-color .15s;
      cursor: pointer;
    }
    #drop:hover { background: var(--bg-card-hover); }
    #drop.over { border-color: var(--red); background: var(--bg-card-hover); }
    #drop .big { font-size: 15.5px; font-weight: 600; }
    #drop .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 7px; line-height: 1.6; }
    #drop .path {
      margin-top: 14px; font-size: 12px; color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all;
    }

    .row { display: flex; align-items: center; gap: 10px; }
    button {
      font: inherit; font-size: 13px; font-weight: 500;
      padding: 8px 16px; border-radius: var(--radius); cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);
      transition: background .15s, border-color .15s;
    }
    button:hover:not(:disabled) { background: var(--bg-card-hover); border-color: var(--border-hover); }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
    button.primary:hover:not(:disabled) { background: rgba(255, 255, 255, .88); }
    button:disabled { opacity: .4; cursor: default; }

    button.lang {
      margin-left: 10px; padding: 4px 9px; font-size: 11px; border-radius: var(--radius);
      color: var(--text-secondary);
    }
    #status { margin-left: auto; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

    #bar-wrap { height: 4px; background: var(--dot); border-radius: 2px; overflow: hidden; display: none; }
    #bar { height: 100%; width: 0%; background: var(--red); transition: width .2s; }

    #done {
      display: none; font-size: 13px; line-height: 1.7;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    #done b { color: var(--success); font-weight: 600; }
    #done .out { color: var(--text-secondary); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }

    #log {
      display: none; flex: 1; min-height: 90px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
      color: var(--text-secondary); overflow: auto; white-space: pre-wrap;
    }

    footer {
      padding: 10px 22px; font-size: 11.5px; color: var(--text-tertiary);
      border-top: 1px solid var(--border); background: var(--bg-secondary);
    }
  </style>
</head>
<body>
  <header>
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect class="brand-tile" x="1" y="1" width="30" height="30" rx="8.5" />
      <text class="brand-letters" x="17.5" y="17.4" font-size="10.5" font-weight="700" letter-spacing="-0.5" text-anchor="middle" dominant-baseline="central">OCR</text>
      <circle class="brand-badge" cx="8.6" cy="8.6" r="4.6" />
      <path d="M6.6 8.7l1.4 1.4 2.4-2.7" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle class="brand-pip" cx="25.8" cy="6.2" r="2.2" />
    </svg>
    <h1 data-i18n="title">Rocktier OCR</h1>
    <span class="tag" data-i18n="tagline">扫描件变可搜索</span>
    <button id="lang" class="lang" title="中文 / EN">EN</button>
    <button id="theme" class="lang" title="浅色 / 深色" aria-label="Theme">☾</button>
  </header>
  <main>
    <div id="drop">
      <div class="big" data-i18n="dropBig">把 PDF 拖到这里</div>
      <div class="sub">
        <span data-i18n="dropSub1">扫描件与图片型 PDF 会被识别并加上可搜索的文字层</span><br>
        <span data-i18n="dropSub2">原生电子版整页跳过，一个字符都不动</span>
      </div>
      <div class="path" id="path"></div>
    </div>
    <div class="row">
      <button id="go" class="primary" data-i18n="start" disabled>开始转换</button>
      <button id="pdf" data-i18n="exportPdf" disabled>导出 PDF</button>
      <button id="txt" data-i18n="exportTxt" disabled>导出 TXT</button>
      <button id="copy" data-i18n="copyText" disabled>复制文本</button>
      <span style="width:10px"></span>
      <button id="cancel" data-i18n="cancel" disabled>取消</button>
      <span id="status"></span>
    </div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="done"></div>
    <div id="log"></div>
  </main>
  <footer data-i18n="footer">识别在本机完成，文档不会离开这台电脑。</footer>
  <script src="lang.js"></script>
  <script src="app.js"></script>
  <script>
    // Light/Dark 切换：默认跟随系统，手动切换后记本机（head 内联脚本负责首帧）。
    (function () {
      var KEY = "rocktier-ocr-theme";
      var btn = document.getElementById("theme");
      if (!btn) return;
      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      }
      function sync() {
        var dark = currentTheme() === "dark";
        btn.textContent = dark ? "\u2600" : "\u263E"; // 深色态显示太阳=可去浅色
        // lang.js 顶层 let current 暴露当前语言（zh / en），script 作用域内可直接引用
        var lang = "en";
        try {
          if (typeof current === "string") lang = current;
        } catch (e) {}
        var s = typeof STRINGS !== "undefined" ? STRINGS[lang] || STRINGS.en : null;
        var title = s
          ? dark
            ? s.themeToLight
            : s.themeToDark
          : dark
            ? "Switch to light"
            : "Switch to dark";
        btn.title = title;
        btn.setAttribute("aria-label", title);
      }
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: light)");
        if (mq.addEventListener)
          mq.addEventListener("change", function () {
            try {
              if (!localStorage.getItem(KEY)) sync();
            } catch (e) {
              sync();
            }
          });
      }
      btn.addEventListener("click", function () {
        var next = currentTheme() === "dark" ? "light" : "dark";
        try {
          localStorage.setItem(KEY, next);
        } catch (e) {
          // 隐私模式：仅本次会话生效
        }
        document.documentElement.setAttribute("data-theme", next);
        sync();
      });
      // 语言切换后刷新标题：applyLang 是挂 window 的函数声明，包一层即可同步
      var origApplyLang = window.applyLang;
      window.applyLang = function () {
        if (typeof origApplyLang === "function") origApplyLang();
        sync();
      };
      sync();
    })();
  </script>
</body>
</html>
