<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rocktier OCR</title>
  <style>
    :root {
      --red: #e64537;
      --ink: #1c1c1e;
      --line: #e5e5e7;
      --bg: #fafafa;
      --muted: #86868b;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink);
      height: 100vh; display: flex; flex-direction: column; user-select: none;
    }
    header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
    main { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px; overflow: auto; }
    #drop {
      border: 1.5px dashed var(--line); border-radius: 12px; padding: 42px 24px;
      text-align: center; transition: border-color .15s, background .15s; cursor: pointer;
    }
    #drop.over { border-color: var(--red); background: #fff; }
    #drop .big { font-size: 16px; font-weight: 600; }
    #drop .sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    #drop .path { font-size: 12px; margin-top: 12px; color: var(--ink); font-family: ui-monospace, monospace; word-break: break-all; }
    .row { display: flex; gap: 10px; align-items: center; }
    button {
      font: inherit; font-size: 13.5px; padding: 9px 18px; border-radius: 8px;
      border: 1px solid var(--line); background: #fff; cursor: pointer;
    }
    button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
    button:disabled { opacity: .45; cursor: default; }
    #bar-wrap { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: none; }
    #bar { height: 100%; width: 0%; background: var(--red); transition: width .2s; }
    #log {
      flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 14px; font-family: ui-monospace, monospace; font-size: 12px;
      overflow: auto; white-space: pre-wrap; color: #3a3a3c; display: none;
    }
    #done { display: none; font-size: 13.5px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    #done b { color: var(--red); }
    footer { padding: 10px 24px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>Rocktier OCR</h1>
  </header>
  <main>
    <div id="drop">
      <div class="big">把 PDF 拖到这里</div>
      <div class="sub">扫描件与图片型 PDF 会被识别并加上可搜索的文字层；原生电子版会原样保留</div>
      <div class="path" id="path"></div>
    </div>
    <div class="row">
      <button id="go" class="primary" disabled>开始识别</button>
      <button id="cancel" disabled>取消</button>
      <span style="flex:1"></span>
      <span id="status" style="font-size:12.5px;color:var(--muted)"></span>
    </div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="done"></div>
    <div id="log"></div>
  </main>
  <footer>识别在本机完成，文档不会上传。拖入或点击上方区域选择文件。</footer>
  <script src="app.js"></script>
</body>
</html>
