<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./styles/tokens.css" />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="256x256" href="./favicon.png" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <title>Rocktier OCR</title>
  <script>
    // 主题必须在内联样式解析前定好：异步设置会先按默认深色画一帧再跳变。
    // 默认跟随系统（家族 MD/Journal 同规则），手动选择记本机。
    (function () {
      try {
        // 2026-10-04 键改名后与运行时对齐：主题已改读 "rocktier.theme"，
        // 这里原先还在读旧的主题键 —— 后果是老用户会看到「先按旧键画首帧、
        // React 挂载后跳成另一种」。旧键保留为回落。
        var saved = localStorage.getItem("rocktier.theme") || localStorage.getItem("rocktier-ocr-theme");
        var t = saved === "light" || saved === "dark" || saved === "auto" ? saved : null;
        if (!t || t === "auto")
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        // 隐私模式：localStorage 抛异常时按深色渲染，功能不受影响
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
/* Geist 家族品牌字体（2026-09-28 定案，audit 7B-5；SIL OFL 自托管可变字体） */
@font-face {
  font-family: "Geist";
  src: url("./fonts/Geist-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Geist Mono";
  src: url("./fonts/GeistMono-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}


    /* 家族 token（与 Rocktier PDF 的 tokens.css 同一套） */
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-elevated: #121212;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --text-primary: rgba(255, 255, 255, 0.95);
      --text-secondary: rgba(255, 255, 255, 0.72);
      --text-tertiary: rgba(255, 255, 255, 0.58);
      --accent: #ffffff;
      --on-accent: #000000;
      --red: #ff4a3d;
      /* --success 深色档不再重定义：走母版（2026-10-06 终裁去绿 = #ffffff）。
         原先这里是 .95 —— 纯 alpha 微差，不影响可读性，但会让令牌回退扫描器
         继续把本仓列为 --success 回退。 */
      /* 家族四档圆角（对齐 MD/PDF tokens.css） */
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
      --accent-hover: rgba(255, 255, 255, 0.88);
    }
    /* 浅色主题：值与 MD tokens.css 的浅色档逐项一致（家族基线） */
    [data-theme="light"] {
  --bg-secondary: #f5f5f5;
  --accent-hover: rgba(0, 0, 0, 0.88);
  --text-primary: rgba(0, 0, 0, 0.92);
  --text-secondary: rgba(0, 0, 0, 0.64);
  --text-tertiary: rgba(0, 0, 0, 0.60);
  --text-muted: rgba(0, 0, 0, 0.58);
  --danger: #b8342a;
  --warning: #c0392b;

      --bg-primary: #ffffff;
      --bg-elevated: #ffffff;
      --bg-card: rgba(0, 0, 0, 0.03);
      --bg-card-hover: rgba(0, 0, 0, 0.06);
      --border: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.16);
      --accent: #000000;
      --on-accent: #ffffff;
      --red: #e64537;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .brand-mark { width: 26px; height: 26px; flex: none; }
    .brand-mark .brand-tile { fill: #0a0a0a; stroke: var(--border); stroke-width: 1; }
    .brand-mark .brand-letters { fill: #ffffff; font-family: inherit; }
    .brand-mark .brand-badge { fill: #ffffff; }
    .brand-mark .brand-pip { fill: var(--red); }
    header h1 { font-size: 14.5px; font-weight: 600; letter-spacing: .2px; }
    header .tag {
      margin-left: auto; font-size: 11px; color: var(--text-tertiary);
      letter-spacing: .3px;
    }

    main { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }

    #drop {
      border: 1px dashed var(--border-hover);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      padding: 44px 24px;
      text-align: center;
      transition: background .15s, border-color .15s;
      cursor: pointer;
    }
    #drop:hover { background: var(--bg-card-hover); }
    #drop.over { border-color: var(--red); background: var(--bg-card-hover); }
    #drop .big { font-size: 15.5px; font-weight: 600; }
    #drop .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 7px; line-height: 1.6; }
    #drop .path {
      margin-top: 14px; font-size: 12px; color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all;
    }

    .row { display: flex; align-items: center; gap: 10px; }
    button {
      font: inherit; font-size: 13px; font-weight: 500;
      padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);
      transition: background .15s, border-color .15s;
    }
    button:hover:not(:disabled) { background: var(--bg-card-hover); border-color: var(--border-hover); }
    button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .4; cursor: default; }

    /* 键盘焦点可见性（a11y）：仅键盘触发 :focus-visible，鼠标点击不留描边 */
    :focus-visible { outline: 2px solid var(--accent, #fff); outline-offset: 2px; }
    :focus:not(:focus-visible) { outline: none; }

    button.lang {
      margin-left: 10px; padding: 4px 9px; font-size: 11px; border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }
    #status { margin-left: auto; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

    #bar-wrap { height: 4px; background: var(--dot); border-radius: 2px; overflow: hidden; display: none; }
    #bar { height: 100%; width: 0%; background: var(--red); transition: width .2s; }

    #done {
      display: none; font-size: 13px; line-height: 1.7;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px 16px;
    }
    #done b { color: var(--success); font-weight: 600; }
    #done .out { color: var(--text-secondary); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }

    #log {
      display: none; flex: 1; min-height: 90px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
      color: var(--text-secondary); overflow: auto; white-space: pre-wrap;
    }

    footer {
      padding: 10px 22px; font-size: 11.5px; color: var(--text-tertiary);
      border-top: 1px solid var(--border); background: var(--bg-secondary);
    }

    /* ───────── 许可胶囊 + 激活对话框（家族 L6，逻辑在 license.js） ───────── */
    .license-pill {
      font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: var(--radius-pill);
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
      cursor: pointer; flex-shrink: 0; white-space: nowrap;
    }
    .license-pill:hover { border-color: var(--border-hover); color: var(--text-primary); background: var(--bg-card-hover); }
    .license-pill.expired { color: var(--red-ink); border-color: rgba(230,69,55,0.35); }
    .license-pill[hidden] { display: none; }

    .license-overlay {
      position: fixed; inset: 0; z-index: 1100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .license-overlay[hidden] { display: none; }
    .license-dialog {
      width: min(400px, calc(100vw - 48px));
      max-height: min(520px, calc(100vh - 48px));
      overflow-y: auto;
      background: var(--bg-secondary); border: 1px solid var(--border-hover);
      border-radius: var(--radius-md); box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
    }
    .license-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
    .license-header h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .license-close {
      border: none; background: none; color: var(--text-tertiary); cursor: pointer;
      font-size: 18px; line-height: 1; padding: 2px 8px; border-radius: 8px;
    }
    .license-close:hover { color: var(--text-primary); background: var(--bg-card-hover); }
    .license-body { padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 8px; }
    .license-body p { font-size: 12px; color: var(--text-primary); line-height: 1.6; }
    .license-body small { font-size: 11px; color: var(--text-tertiary); line-height: 1.55; display: block; }
    .license-body .license-error { color: var(--red-ink); }
    .license-field { display: flex; flex-direction: column; gap: 5px; }
    .license-field label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
    .license-field input {
      border: 1px solid var(--border-hover); border-radius: var(--radius-sm);
      padding: 8px 10px; font-size: 12px; background: var(--bg-card);
      color: var(--text-primary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .license-field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .license-footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px 14px; flex-wrap: wrap; }
    /* 复用全局 button / button.primary（激活钮），只在对话框里收紧尺寸；
       margin-inline-start: auto 使激活钮在 RTL 布局下也靠右（家族惯例） */
    .license-footer button { padding: 6px 14px; font-size: 12px; border-radius: var(--radius-sm); min-height: 30px; }
    .license-footer button.primary { margin-inline-start: auto; font-weight: 600; }

/* ── 主题切换按钮（家族唯一实现，tokens.css §icon-btn 副本）──────────────
 * 母版：rocktier-docs/docs/rocktier/tokens.css L320-388
 * 各产品各存一份而不是 @import 母版：母版是构建期拷贝源，产品要能独立打包，
 * 且令牌名在各产品方言里略有差异（见下方 var() 回退）。
 * 28×28 视觉 / 40×40 命中区（无障碍最小点击区）。
 */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm, 12px);
  color: var(--text-secondary, var(--text2, #888));
  cursor: pointer;
  position: relative;
  transition: background var(--dur-hover, 150ms) var(--ease, ease),
    border-color var(--dur-hover, 150ms) var(--ease, ease),
    color var(--dur-hover, 150ms) var(--ease, ease);
  flex: none;
}

/* 本文件有一条全局 `button:hover:not(:disabled)`（特异性 0,2,1），
   比 `.icon-btn:hover`（0,2,0）更高 —— 必须带上 button 前缀抬回同一档，
   否则这个按钮的 hover 会被全局规则吃掉，与家族规范不一致。 */
button.icon-btn:hover {
  background: var(--bg-card-hover, rgba(255, 255, 255, 0.06));
  border-color: var(--border, rgba(255, 255, 255, 0.08));
  color: var(--text-primary, var(--text, #e8e8e8));
}

button.icon-btn:active {
  background: var(--bg-card, var(--card, rgba(255, 255, 255, 0.03)));
}

/* 视觉 28px，命中区 40px（满足无障碍最小点击区而不放大视觉尺寸） */
.icon-btn::after {
  content: "";
  position: absolute;
  width: 40px;
  height: 40px;
  transform: translate(-50%, -50%);
  left: 50%;
  top: 50%;
}

/* 图标本身：统一 16px、stroke 走 currentColor、禁止继承文本颜色 */
.icon-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

/* 三态指示：auto 空心环（跟随系统），light/dark 实心点。
   红点不得是状态的唯一编码 —— title / aria-label 同时说明当前档位。 */
.icon-btn[data-mode]::before {
  content: "";
  position: absolute;
  right: 2px;
  bottom: 2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--red, #ff4a3d);
}

.icon-btn[data-mode="auto"]::before {
  background: transparent;
  border: 1px solid var(--text-tertiary, var(--text-muted, #888));
}
/* 三态图标互斥：auto 显示「屏幕」，light 显示月牙，dark 显示太阳 */
.icon-btn .sun, .icon-btn .moon, .icon-btn .monitor { display: none; }
.icon-btn[data-mode="auto"] .monitor { display: block; }
.icon-btn[data-mode="light"] .moon { display: block; }
.icon-btn[data-mode="dark"] .sun { display: block; }

    /* 家族统一 reduced-motion 方案（0.01ms 而非 0：保留 transitionend/animationend 事件，
        ui-ux-pro-max a11y 基线；audit 7B-3 CRITICAL 项） */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }


  /* ── 检查更新对话框（入口：帮助菜单「检查更新…」）────────────────────
     点击才联网：启动时、工作中、后台都不检查，见 updates.js 头注。
     右下角常驻悬浮入口已移除 —— fixed 定位没有 right 时会停在静态位置，
     盖住底部内容（Compressor v0.1.10 实测），故全部收进菜单 + 本对话框。
     结构照 .license-overlay 系列，z-index 对齐。 */
    .update-overlay {
      position: fixed; inset: 0; z-index: 1100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .update-overlay[hidden] { display: none; }
    .update-dialog {
      width: min(400px, calc(100vw - 48px));
      max-height: min(520px, calc(100vh - 48px));
      overflow-y: auto;
      background: var(--bg-secondary); border: 1px solid var(--border-hover);
      border-radius: var(--radius-md); box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
    }
    .update-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
    .update-header h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .update-close {
      border: none; background: none; color: var(--text-tertiary); cursor: pointer;
      font-size: 18px; line-height: 1; padding: 2px 8px; border-radius: 8px;
    }
    .update-close:hover { color: var(--text-primary); background: var(--bg-card-hover); }
    .update-body { padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 8px; }
    .update-body p { font-size: 12px; color: var(--text-primary); line-height: 1.6; }
    .update-body small { font-size: 11px; color: var(--text-tertiary); line-height: 1.55; display: block; }
    .update-footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px 14px; flex-wrap: wrap; }
    .update-footer-spacer { flex: 1; }
    .update-footer button {
      min-height: 30px; padding: 6px 14px; font-size: 12px;
      border: 1px solid var(--border-hover); border-radius: var(--radius-sm);
      background: var(--bg-card); color: var(--text-primary); cursor: pointer;
    }
    .update-footer button:hover { border-color: var(--accent); }
    /* 「获取 v…」主按钮：有新版时唯一需要用户点的动作，用 accent 让它显眼。 */
    .update-footer button.update-get-btn {
      background: var(--accent); border-color: transparent; color: var(--bg); font-weight: 600;
    }
  </style>
</head>
