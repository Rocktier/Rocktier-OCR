[package]
name = "rocktier-ocr"
version = "0.1.5"
edition = "2021"
description = "Rocktier OCR - make scanned PDFs searchable"

[lib]
name = "rocktier_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
ocr-engine = { path = "../engine" }
write-searchable = { path = "../writer" }
pdfium-render = "0.9.4"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = 2
